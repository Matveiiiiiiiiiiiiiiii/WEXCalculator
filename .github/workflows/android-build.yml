name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Oven Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Original Dependencies
        run: bun install

      - name: Force Install Capacitor and Assets Dependencies
        run: |
          bun add @capacitor/core @capacitor/android
          bun add -d @capacitor/cli @capacitor/assets

      - name: Build Web App (Vite)
        run: bun run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize Capacitor and Create Android Folder
        run: |
          bunx cap init "WEXCalculator" "com.aiapp.wexcalculator" --web-dir=dist
          bunx cap add android

      - name: Generate Android Icons (Silent Mode)
        run: bunx capacitor-assets generate --android --assetPath icon.png

      - name: Sync Web Code to Android Project
        run: bunx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wex-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
